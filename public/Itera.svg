<?xml version="1.0" encoding="UTF-8"?>
<!--
  Itera monogram favicon — "I/" per brand.devfellowship.com/itera.
  bg #0A0908, the "I" in ink #F4EDE2, the slash ALWAYS evergreen #3FD17F.
  Drawn as vector paths (no webfont dependency) in a condensed display style.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Itera">
  <rect width="64" height="64" rx="12" fill="#0A0908"/>
  <!-- "I" — condensed serifless bar with short top/bottom feet -->
  <g fill="#F4EDE2">
    <rect x="20" y="16" width="14" height="6"/>
    <rect x="24" y="16" width="6" height="32"/>
    <rect x="20" y="42" width="14" height="6"/>
  </g>
  <!-- "/" — evergreen slash, -2px-feel kerning brought tight to the I -->
  <path d="M44 16 L50 16 L40 48 L34 48 Z" fill="#3FD17F"/>
</svg>
